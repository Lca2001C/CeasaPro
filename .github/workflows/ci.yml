name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancela execuções antigas do mesmo branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # Gate de qualidade: lint + typecheck + build + testes + E2E.
  # ATENÇÃO: se a integração Git da Vercel estiver ligada, ela publica por conta
  # própria a cada push e NÃO espera este job. Um CI vermelho não impede o deploy.
  # Por isso as migrations são aplicadas no BUILD (scripts/deploy-migrate.mjs), que
  # roda nos dois caminhos: no build da Vercel e no `vercel build` daqui.
  # ─────────────────────────────────────────────────────────────
  ci:
    name: Lint · Typecheck · Build · Testes · E2E
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ceasapro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ceasapro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ceasapro_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/ceasapro_test?schema=public
      JWT_SECRET: ci-access-secret-change-in-production-32-bytes
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL_DAYS: "30"
      APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      CRON_SECRET: ci-cron-secret
      MERCADOPAGO_WEBHOOK_SECRET: ci-webhook-secret
      # SMTP_USER / SMTP_PASSWORD ficam de fora de propósito: sem elas o envio de
      # e-mail vira no-op e o CI não abre conexão SMTP com o Gmail.
      SEED_SUPERADMIN_EMAIL: admin@ceasapro.com.br
      SEED_SUPERADMIN_PASSWORD: ci-superadmin-password-123
      SEED_DEMO: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Validar schema Prisma
        run: npx prisma validate

      - name: Lint (zero avisos)
        run: npm run lint -- --max-warnings=0

      - name: Checagem de tipos
        run: npm run typecheck

      - name: Migrations (banco de teste)
        run: npx prisma migrate deploy

      - name: Seed inicial
        run: npm run db:seed

      - name: Testes unitários
        run: npm run test:unit

      - name: Testes de integração
        run: npm run test:integration

      - name: Verificação pré-flight (env, banco, consistência do trial)
        run: npm run preflight

      - name: Build de produção
        run: npm run build

      # `--with-deps` roda `apt-get update`, e a imagem do runner do GitHub traz os
      # repositorios apt da Microsoft (azure-cli e ubuntu/24.04/prod) configurados.
      # Quando eles respondem 403 — intermitente e fora do nosso controle — o apt
      # sai com codigo 100 e derruba a instalacao do navegador, mesmo que o
      # navegador nada tenha a ver com aqueles repositorios. Nada neste pipeline
      # usa pacote da Microsoft, entao removemos as fontes antes de tocar no apt.
      - name: Remover fontes apt da Microsoft (evita 403 que quebra o apt)
        run: |
          # Globs sem correspondencia sao passados literalmente e o -f ignora
          # caminho inexistente, entao isto e seguro se os arquivos mudarem de nome.
          sudo rm -f /etc/apt/sources.list.d/*microsoft*.list
          sudo rm -f /etc/apt/sources.list.d/*microsoft*.sources
          sudo rm -f /etc/apt/sources.list.d/*azure*.list
          sudo rm -f /etc/apt/sources.list.d/*azure*.sources
          echo "Fontes apt restantes:"
          ls -1 /etc/apt/sources.list.d/ || true

      # Se ainda assim o apt falhar (outro repositorio fora do ar), cai para a
      # instalacao SEM `--with-deps`: a imagem do runner ja traz as bibliotecas
      # que o Chromium precisa. Nao mascara problema real — se faltar alguma lib,
      # o proprio passo de E2E falha ao abrir o navegador, e com mensagem clara.
      - name: Instalar navegador do Playwright
        run: |
          if npx playwright install --with-deps chromium; then
            exit 0
          fi
          echo "::warning::playwright install --with-deps falhou (provavel apt indisponivel). Tentando sem --with-deps."
          npx playwright install chromium

      - name: Testes E2E (Playwright)
        run: npm run test:e2e

      - name: Publicar relatório do Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # Deploy de produção — só em push na main e SÓ se o job "ci" passou.
  # Requer os secrets VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID.
  # Sem os secrets, o passo é ignorado (a integração Git da Vercel assume).
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy (Vercel)
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # As migrations NÃO são aplicadas aqui de propósito. Este passo existia e,
      # sem o secret PROD_DIRECT_URL, imprimia "pulando migrations" e saía com
      # SUCESSO — foi assim que um deploy subiu com o banco atrasado e derrubou o
      # login (P2022: users.emailVerifiedAt does not exist). Agora quem aplica é o
      # build, via scripts/deploy-migrate.mjs: se a migration falhar, o build falha
      # e nada sobe pela metade.
      - name: Deploy na Vercel (se configurado)
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN não configurado — deploy delegado à integração Git da Vercel."
            exit 0
          fi
          npm i -g vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

# Blueprint do CeasaPro no Render (web + Postgres + cron de billing).
# Aplique em: Dashboard Render → New → Blueprint → este repositório.
# Guia completo: docs/09-deploy-render-e-vercel.md
#
# Variáveis com sync: false precisam ser preenchidas na hora de criar o Blueprint.
# Planos abaixo são o mínimo pago (o free do Render dorme e quebra webhook/PIX).

databases:
  - name: ceasapro-db
    plan: basic-256mb
    postgresMajorVersion: 16
    region: oregon

services:
  - type: web
    name: ceasapro
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: ceasapro-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: ceasapro-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "30"
      - key: SEED_DEMO
        value: "false"
      # URL pública do serviço — https://<nome>.onrender.com ou seu domínio próprio.
      # Usada nos links dos e-mails (redefinição de senha, boas-vindas) e no Mercado Pago.
      # Se esquecer de preencher, o app cai em RENDER_EXTERNAL_URL (injetada pelo Render),
      # então o link de redefinição continua saindo com o domínio certo — mas preencha:
      # NEXT_PUBLIC_APP_URL entra no build do client e não tem esse fallback.
      - key: APP_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: SEED_SUPERADMIN_EMAIL
        sync: false
      - key: SEED_SUPERADMIN_PASSWORD
        sync: false
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false
      - key: NEXT_PUBLIC_MERCADOPAGO_PUBLIC_KEY
        sync: false
      # Resend — sem estas duas o "esqueci minha senha" não envia e-mail nenhum.
      # O domínio de EMAIL_FROM precisa estar verificado no painel do Resend.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Opcionais (pode deixar em branco):
      # EMAIL_REPLY_TO      — endereço de resposta monitorado (ajuda na reputação anti-spam)
      # RESEND_WEBHOOK_SECRET — só se cadastrar o webhook de bounce/spam no Resend
      - key: EMAIL_REPLY_TO
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: NEXT_PUBLIC_SUPPORT_WHATSAPP
        sync: false

  - type: cron
    name: ceasapro-billing-cron
    runtime: node
    plan: starter
    region: oregon
    schedule: "0 6 * * *"
    buildCommand: echo ok
    startCommand: node scripts/run-billing-cron.mjs
    envVars:
      - key: APP_URL
        sync: false
      - key: CRON_SECRET
        fromService:
          type: web
          name: ceasapro
          envVarKey: CRON_SECRET
